name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check

  build:
    # Every release target must at least compile. Linux runners only: the
    # binaries are pure Go (CGO_ENABLED=0), so macOS builds cross-compile
    # here and don't need a macOS runner.
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tags for the version string
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release
      - name: Smoke-test the linux binary
        run: |
          ./dist/footy-linux-amd64 version
          ./dist/footy-linux-amd64 --db "$RUNNER_TEMP/smoke.db" status
          ./dist/footy-linux-amd64 competitions
