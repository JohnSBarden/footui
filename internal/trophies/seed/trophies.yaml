# Hand-curated club honours.
#
# Like club colors, trophies have no scrapeable structured source, so this
# is a manual dataset — the design doc named it as a known chore and
# deferred full automation explicitly. It is deliberately partial, and the
# Team screen shows a plain empty state for clubs it doesn't cover rather
# than implying they have never won anything.
#
# Scope of this file, stated so it is not mistaken for a complete honours
# list:
#
#   * European Cup / Champions League wins: complete, for clubs in the
#     competitions footy covers. These are finite and well documented.
#   * Domestic league titles: from the 2000-01 season onward only. An older
#     title is not absent because the club didn't win it — it is outside
#     what this file claims to cover. The Team screen labels the panel with
#     that cutoff so the number on screen is never read as an all-time
#     count.
#   * Domestic cups: not covered yet.
#
# `id` and `aliases` work exactly as in the club colors seed
# (internal/colors/seed/teamcolors.yaml): an entry applies only when it
# matches a team actually in the cache, so an entry for an uncached club,
# or one whose ID guesses the provider's spelling wrongly, is inert.
#
# Seasons are free text and displayed as written; use the "2003-04" form.

# --- England ---
- id: eng-arsenal
  honours:
    - title: Premier League
      type: league_title
      competition: eng-premier-league
      seasons: ["2001-02", "2003-04", "2025-26"]

