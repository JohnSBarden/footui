# Hand-curated club brand colors.
#
# There is no scrapeable structured source for club colors — the design doc
# named this as a known, unavoidable manual chore, and it remains one. Each
# entry is a club's primary and secondary shirt/crest colors as hex.
#
# `id` is footui's canonical team ID: the country prefix plus a slug of the
# team name as the data provider spells it (see internal/data/provider/
# understat/mapper.go). Because that spelling comes from the provider, an
# entry only takes effect if the ID matches a team actually in the cache.
#
# `aliases` exist for exactly that reason. The English entries below were
# verified against a live understat.com payload; the others are the same
# scheme applied to that provider's usual spellings, with plausible
# alternatives listed as aliases. An entry that matches nothing is simply
# never applied — a wrong guess is inert, not harmful. Run `footy colors`
# after refreshing a competition to see which cached clubs still lack
# colors, then add or correct an entry here.
#
# Colors are never rendered raw: internal/tui/styles/teamtheme.go adjusts
# them per terminal background so a near-black or near-white club stays
# readable. Pick the club's actual colors here, not colors that happen to
# look good on your terminal.

